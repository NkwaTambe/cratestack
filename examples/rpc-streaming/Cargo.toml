[package]
name = "rpc-streaming-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "RPC server with a list-return procedure streamed over Accept: application/cbor-seq. Demonstrates content-negotiated streaming on the same POST /rpc/{op_id} route as unary — no separate streaming endpoint."

[[bin]]
name = "rpc-streaming-server"
path = "src/main.rs"

[dependencies]
async-stream.workspace = true
# `default-features = false` drops the `postgres` feature (cratestack#329)
# — this schema is `db = None`, so `sqlx`/`cratestack-sqlx` are never
# needed. See `examples/no-database-verification` for the `cargo tree` proof.
cratestack = { package = "cratestack-pg", path = "../../crates/cratestack-pg", default-features = false }
cratestack-codec-cbor = { path = "../../crates/cratestack-codec-cbor" }
cratestack-codec-json = { path = "../../crates/cratestack-codec-json" }
minicbor-serde = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
cratestack-client-rust = { path = "../../crates/cratestack-client-rust", default-features = false }
reqwest.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { workspace = true }
